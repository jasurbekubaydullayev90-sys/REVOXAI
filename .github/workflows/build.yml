          package com.example.jarvis

          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          object Brain {

              // Model nomi o'zgargan bo'lsa, faqat shu qatorlarni almashtiring. Kalit sk-ant bilan boshlansa Claude, aks holda Gemini ishlatiladi
              const val MODEL = "claude-sonnet-5-5"
              const val GEMINI_MODEL = "gemini-flash-latest"

              private val SYSTEM = """
          Sen JARVIS - foydalanuvchining erkak ovozli do'sti va yordamchisan. Telefonda ovoz orqali gaplashyapsan, shuning uchun tabiiy, jonli, iliq, ozgina hazilkash odamdek gapir. Javoblar qisqa (1-3 gap), o'zbek tilida (lotin). Emoji, ro'yxat va maxsus belgilar ishlatma. Suhbat zerikarli bo'lmasin: ba'zan qiziq narsa aytib yoki qisqa savol berib suhbatni davom ettir. Oldingi gaplarni eslab qol.

          FAQAT bitta JSON obyekt qaytar, boshqa matn yozma. Maydonlar:
          {"type":"chat|youtube|telegram|app|open|call|alarm|timer","reply":"","query":"","contact":"","message":"","app":"","url":"","number":"","hour":0,"minute":0,"seconds":0}

          - chat: oddiy suhbat va savol-javob. reply = javobing.
          - youtube: query = qidiruv matni (faqat ochish bo'lsa bo'sh qoldir).
          - telegram: contact = kimga, message = yuboriladigan matn.
          - app: telefondagi ilovani ochish, app = ilova nomi (Instagram, WhatsApp, Kamera, Sozlamalar, Spotify va hokazo).
          - open: sayt ochish, url = https:// havola. Google qidiruv: https://www.google.com/search?q=SOZ ; xarita: https://www.google.com/maps/search/?api=1&query=JOY . Maxsus belgilar URL-kodlansin.
          - call: number = telefon raqami (faqat foydalanuvchi aytgan raqam).
          - alarm: hour va minute (24 soatlik). timer: seconds.
          Har doim reply ber: nima qilayotganing haqida qisqa va tabiiy gap.
          """.trimIndent()

              fun ask(key: String, history: JSONArray, user: String): JSONObject {
                  val now = SimpleDateFormat("yyyy-MM-dd HH:mm", Locale.US).format(Date())
                  val system = SYSTEM + "\nHozirgi vaqt: " + now
                  val raw = if (key.startsWith("sk-ant")) askClaude(key, system, history, user)
                  else askGemini(key, system, history, user)

                  val s = raw.indexOf('{')
                  val e = raw.lastIndexOf('}')
                  val out = try {
                      JSONObject(raw.substring(s, e + 1))
                  } catch (ex: Exception) {
                      JSONObject().put("type", "chat").put("reply", raw)
                  }

                  history.put(JSONObject().put("role", "user").put("content", user))
                  history.put(JSONObject().put("role", "assistant").put("content", out.toString()))
                  while (history.length() > 16) {
                      history.remove(0)
                      history.remove(0)
                  }
                  return out
              }

              private fun post(url: String, headers: Map<String, String>, body: JSONObject): String {
                  val conn = URL(url).openConnection() as HttpURLConnection
                  conn.requestMethod = "POST"
                  conn.doOutput = true
                  conn.connectTimeout = 15000
                  conn.readTimeout = 60000
                  conn.setRequestProperty("content-type", "application/json")
                  for ((k, v) in headers) conn.setRequestProperty(k, v)
                  conn.outputStream.use { it.write(body.toString().toByteArray(Charsets.UTF_8)) }
                  val code = conn.responseCode
                  val stream = if (code in 200..299) conn.inputStream else conn.errorStream
                  val text = stream?.bufferedReader()?.use { it.readText() } ?: ""
                  if (code !in 200..299) throw Exception("API " + code + ": " + text.take(150))
                  return text
              }

              private fun askClaude(key: String, system: String, history: JSONArray, user: String): String {
                  val msgs = JSONArray()
                  for (i in 0 until history.length()) msgs.put(history.get(i))
                  msgs.put(JSONObject().put("role", "user").put("content", user))
                  val body = JSONObject()
                      .put("model", MODEL)
                      .put("max_tokens", 500)
                      .put("system", system)
                      .put("messages", msgs)
                  val text = post(
                      "https://api.anthropic.com/v1/messages",
                      mapOf("x-api-key" to key, "anthropic-version" to "2023-06-01"),
                      body
                  )
                  return JSONObject(text).getJSONArray("content").getJSONObject(0).getString("text").trim()
              }

              private fun part(text: String) = JSONArray().put(JSONObject().put("text", text))

              private fun askGemini(key: String, system: String, history: JSONArray, user: String): String {
                  val contents = JSONArray()
                  for (i in 0 until history.length()) {
                      val m = history.getJSONObject(i)
                      val role = if (m.getString("role") == "assistant") "model" else "user"
                      contents.put(JSONObject().put("role", role).put("parts", part(m.getString("content"))))
                  }
                  contents.put(JSONObject().put("role", "user").put("parts", part(user)))
                  val body = JSONObject()
                      .put("systemInstruction", JSONObject().put("parts", part(system)))
                      .put("contents", contents)
                      .put(
                          "generationConfig",
                          JSONObject().put("maxOutputTokens", 1500).put("responseMimeType", "application/json")
                      )
                  val text = post(
                      "https://generativelanguage.googleapis.com/v1beta/models/" + GEMINI_MODEL + ":generateContent",
                      mapOf("x-goog-api-key" to key),
                      body
                  )
                  return JSONObject(text).getJSONArray("candidates").getJSONObject(0)
                      .getJSONObject("content").getJSONArray("parts").getJSONObject(0)
                      .getString("text").trim()
              }
          }
          EOF
          mkdir -p app/src/main/java/com/example/jarvis
          cat > app/src/main/java/com/example/jarvis/HudView.kt << 'EOF'
          package com.example.jarvis

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.DashPathEffect
          import android.graphics.LinearGradient
          import android.graphics.Paint
          import android.graphics.RadialGradient
          import android.graphics.Shader
          import android.view.View
          import kotlin.math.PI
          import kotlin.math.cos
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.sin

          enum class HudState { IDLE, LISTENING, THINKING, SPEAKING }

          class HudView(context: Context) : View(context) {

              @Volatile var state = HudState.IDLE
              @Volatile var level = 0f

              private val d = resources.displayMetrics.density
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val cyan = Color.rgb(25, 211, 255)
              private val pale = Color.rgb(142, 242, 255)
              private var last = System.nanoTime()
              private var tm = 0f
              private var smooth = 0f
              private var a1 = 0f
              private var a2 = 0f
              private var a3 = 0f
              private var a4 = 0f
              private var a5 = 0f
              private val rnd = java.util.Random()

              private fun fresh(style: Paint.Style = Paint.Style.STROKE) {
                  p.reset()
                  p.isAntiAlias = true
                  p.style = style
              }

              private fun ring(c: Canvas, cx: Float, cy: Float, r: Float, sw: Float, dash: FloatArray?, rot: Float, alpha: Int) {
                  c.save()
                  c.rotate(rot, cx, cy)
                  for (pass in 0..1) {
                      fresh()
                      p.color = cyan
                      if (dash != null) p.pathEffect = DashPathEffect(dash, 0f)
                      if (pass == 0) {
                          p.strokeWidth = sw * 3f
                          p.alpha = alpha / 6
                      } else {
                          p.strokeWidth = sw
                          p.alpha = alpha
                      }
                      c.drawCircle(cx, cy, r, p)
                  }
                  c.restore()
              }

              override fun onDraw(c: Canvas) {
                  val now = System.nanoTime()
                  val dt = min((now - last) / 1e9f, 0.05f)
                  last = now
                  tm += dt

                  val sp = when (state) {
                      HudState.IDLE -> 1f
                      HudState.LISTENING -> 2.6f
                      HudState.THINKING -> 5f
                      HudState.SPEAKING -> 2f
                  }
                  a1 = (a1 + 8f * sp * dt) % 360f
                  a2 = (a2 + 14f * sp * dt) % 360f
                  a3 = (a3 - 18f * sp * dt) % 360f
                  a4 = (a4 + 30f * sp * dt) % 360f
                  a5 = (a5 - 55f * sp * dt) % 360f

                  val target = when (state) {
                      HudState.IDLE -> 0.12f
                      HudState.LISTENING -> level
                      HudState.THINKING -> 0.3f + 0.2f * sin(tm * 6f)
                      HudState.SPEAKING -> 0.35f + 0.5f * rnd.nextFloat()
                  }
                  smooth += (target - smooth) * min(1f, dt * 10f)

                  val w = width.toFloat()
                  val h = height.toFloat()
                  val cx = w / 2f
                  val cy = h * 0.40f
                  val big = min(w * 0.46f, h * 0.30f)

                  // background
                  fresh(Paint.Style.FILL)
                  p.shader = RadialGradient(
                      cx, cy, max(w, h) * 0.8f,
                      intArrayOf(Color.rgb(6, 48, 74), Color.rgb(2, 21, 37), Color.rgb(1, 10, 18)),
                      floatArrayOf(0f, 0.45f, 1f), Shader.TileMode.CLAMP
                  )
                  c.drawRect(0f, 0f, w, h, p)

                  // grid
                  fresh()
                  p.color = cyan
                  p.alpha = 22
                  p.strokeWidth = 1f
                  var gx = 0f
                  while (gx < w) { c.drawLine(gx, 0f, gx, h, p); gx += 44f * d }
                  var gy = 0f
                  while (gy < h) { c.drawLine(0f, gy, w, gy, p); gy += 44f * d }

                  // scanning band
                  val bandH = 120f * d
                  val sy = ((tm / 7f) % 1f) * (h + bandH) - bandH
                  fresh(Paint.Style.FILL)
                  p.shader = LinearGradient(
                      0f, sy, 0f, sy + bandH,
                      intArrayOf(Color.argb(0, 25, 211, 255), Color.argb(34, 25, 211, 255), Color.argb(0, 25, 211, 255)),
                      floatArrayOf(0f, 0.5f, 1f), Shader.TileMode.CLAMP
                  )
                  c.drawRect(0f, sy, w, sy + bandH, p)

                  // corner brackets
                  fresh()
                  p.color = cyan
                  p.strokeWidth = 3f * d
                  val m = 12f * d
                  val l = 26f * d
                  c.drawLine(m, m, m + l, m, p); c.drawLine(m, m, m, m + l, p)
                  c.drawLine(w - m, m, w - m - l, m, p); c.drawLine(w - m, m, w - m, m + l, p)
                  c.drawLine(m, h - m, m + l, h - m, p); c.drawLine(m, h - m, m, h - m - l, p)
                  c.drawLine(w - m, h - m, w - m - l, h - m, p); c.drawLine(w - m, h - m, w - m, h - m - l, p)

                  // rings
                  ring(c, cx, cy, big, 2f * d, floatArrayOf(2f * d, 12f * d), a1, 230)

                  c.save()
                  c.rotate(a2, cx, cy)
                  fresh()
                  p.color = cyan
                  p.alpha = 190
                  p.strokeWidth = 1.5f * d
                  for (i in 0 until 120) {
                      val ang = i * 3.0 * PI / 180.0
                      val long = i % 5 == 0
                      val r1 = big * 0.93f
                      val r2 = r1 - (if (long) 9f else 5f) * d
                      c.drawLine(
                          cx + r1 * cos(ang).toFloat(), cy + r1 * sin(ang).toFloat(),
                          cx + r2 * cos(ang).toFloat(), cy + r2 * sin(ang).toFloat(), p
                      )
                  }
                  c.restore()

                  ring(c, cx, cy, big * 0.83f, 9f * d, floatArrayOf(110f * d, 26f * d, 18f * d, 26f * d), a3, 140)
                  ring(c, cx, cy, big * 0.72f, 2.5f * d, floatArrayOf(8f * d, 6f * d), a4, 230)

                  c.save()
                  c.rotate(a5, cx, cy)
                  val rr = big * 0.62f
                  for (pass in 0..1) {
                      fresh()
                      p.color = cyan
                      p.strokeCap = Paint.Cap.ROUND
                      if (pass == 0) { p.strokeWidth = 18f * d; p.alpha = 40 } else { p.strokeWidth = 5f * d; p.alpha = 255 }
                      c.drawArc(cx - rr, cy - rr, cx + rr, cy + rr, 0f, 110f, false, p)
                  }
                  c.restore()
                  ring(c, cx, cy, big * 0.62f, 1f * d, null, 0f, 90)

                  // sound bars
                  val r0 = big * 0.40f
                  fresh()
                  p.color = pale
                  p.strokeWidth = 2.5f * d
                  p.strokeCap = Paint.Cap.ROUND
                  for (i in 0 until 72) {
                      val ang = i / 72.0 * 2.0 * PI
                      val n = (sin(tm * 2f + i * 0.7f) * sin(tm * 1.3f + i * 0.23f)) * 0.5f + 0.5f
                      val len = big * 0.02f + n * smooth * big * 0.2f
                      val ca = cos(ang).toFloat()
                      val sa = sin(ang).toFloat()
                      c.drawLine(cx + ca * r0, cy + sa * r0, cx + ca * (r0 + len), cy + sa * (r0 + len), p)
                  }

                  // core
                  val orbR = big * 0.30f * (1f + 0.04f * sin(tm * 2f) + smooth * 0.10f)
                  for (k in 3 downTo 1) {
                      fresh(Paint.Style.FILL)
                      p.color = cyan
                      p.alpha = 28
                      c.drawCircle(cx, cy, orbR + k * 9f * d, p)
                  }
                  fresh(Paint.Style.FILL)
                  p.shader = RadialGradient(
                      cx, cy - orbR * 0.1f, orbR,
                      intArrayOf(Color.rgb(233, 253, 255), Color.rgb(95, 230, 255), Color.rgb(10, 127, 168), Color.rgb(3, 40, 61)),
                      floatArrayOf(0f, 0.22f, 0.58f, 1f), Shader.TileMode.CLAMP
                  )
                  c.drawCircle(cx, cy, orbR, p)
                  fresh()
                  p.color = pale
                  p.strokeWidth = 1.5f * d
                  c.drawCircle(cx, cy, orbR, p)
                  fresh(Paint.Style.FILL)
                  p.color = Color.WHITE
                  p.textSize = 13f * d
                  p.textAlign = Paint.Align.CENTER
                  p.letterSpacing = 0.25f
                  c.drawText("JARVIS", cx, cy + 4.5f * d, p)

                  postInvalidateOnAnimation()
              }
          }
