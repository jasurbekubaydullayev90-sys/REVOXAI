          package com.example.jarvis

          import android.content.Context
          import android.media.MediaPlayer
          import android.os.Handler
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.Locale

          /**
           * Ovoz chiqarish. Azure kaliti kiritilgan bo'lsa, haqiqiy erkak ovozi (uz-UZ-SardorNeural),
           * aks holda telefonning o'z ovozi (past ohangda).
           */
          class Speaker(private val ctx: Context, private val ui: Handler) {

              var azureKey = ""
              var azureRegion = "westeurope"

              private var tts: TextToSpeech? = null
              private var ttsReady = false
              private var player: MediaPlayer? = null
              private var onDone: (() -> Unit)? = null
              private var token = 0

              init {
                  tts = TextToSpeech(ctx) { status ->
                      if (status == TextToSpeech.SUCCESS) {
                          val t = tts
                          if (t != null) {
                              val loc = listOf(Locale("uz", "UZ"), Locale("tr", "TR"), Locale("ru", "RU"), Locale.US)
                                  .firstOrNull { t.isLanguageAvailable(it) >= TextToSpeech.LANG_AVAILABLE }
                              if (loc != null) t.language = loc
                              try {
                                  val lang = t.language?.language
                                  val male = t.voices?.firstOrNull {
                                      it.locale.language == lang &&
                                          it.name.contains("male", true) && !it.name.contains("female", true)
                                  }
                                  if (male != null) t.voice = male
                              } catch (_: Exception) {}
                              t.setPitch(0.85f)
                              t.setSpeechRate(1.0f)
                              t.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                                  override fun onStart(utteranceId: String?) {}
                                  override fun onDone(utteranceId: String?) { ui.post { finish() } }
                                  @Deprecated("Deprecated in Java")
                                  override fun onError(utteranceId: String?) { ui.post { finish() } }
                              })
                              ttsReady = true
                          }
                      }
                  }
              }

              fun speak(text: String, done: () -> Unit) {
                  stop()
                  onDone = done
                  if (text.isBlank()) { finish(); return }
                  if (azureKey.isNotBlank()) azure(text) else local(text)
              }

              fun stop() {
                  token++
                  onDone = null
                  try { tts?.stop() } catch (_: Exception) {}
                  try { player?.release() } catch (_: Exception) {}
                  player = null
              }

              fun shutdown() {
                  stop()
                  try { tts?.shutdown() } catch (_: Exception) {}
              }

              private fun finish() {
                  try { player?.release() } catch (_: Exception) {}
                  player = null
                  val d = onDone
                  onDone = null
                  d?.invoke()
              }

              private fun local(text: String) {
                  val t = tts
                  if (!ttsReady || t == null) { finish(); return }
                  t.speak(text, TextToSpeech.QUEUE_FLUSH, null, "jarvis")
              }

              private fun esc(s: String) = s.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")

              private fun azure(text: String) {
                  val key = azureKey
                  val region = azureRegion
                  val gen = ++token
                  Thread {
                      var file: File? = null
                      try {
                          val conn = URL("https://" + region + ".tts.speech.microsoft.com/cognitiveservices/v1")
                              .openConnection() as HttpURLConnection
                          conn.requestMethod = "POST"
                          conn.doOutput = true
                          conn.connectTimeout = 10000
                          conn.readTimeout = 20000
                          conn.setRequestProperty("Ocp-Apim-Subscription-Key", key)
                          conn.setRequestProperty("Content-Type", "application/ssml+xml")
                          conn.setRequestProperty("X-Microsoft-OutputFormat", "audio-24khz-48kbitrate-mono-mp3")
                          conn.setRequestProperty("User-Agent", "jarvis-android")
                          val ssml = "<speak version='1.0' xml:lang='uz-UZ'><voice xml:lang='uz-UZ' name='uz-UZ-SardorNeural'>" +
                              esc(text) + "</voice></speak>"
                          conn.outputStream.use { it.write(ssml.toByteArray(Charsets.UTF_8)) }
                          if (conn.responseCode == 200) {
                              val f = File(ctx.cacheDir, "say.mp3")
                              conn.inputStream.use { inp -> f.outputStream().use { out -> inp.copyTo(out) } }
                              file = f
                          }
                      } catch (_: Exception) {}
                      val result = file
                      ui.post {
                          if (gen != token) return@post
                          if (result != null) play(result) else local(text)
                      }
                  }.start()
              }

              private fun play(file: File) {
                  try {
                      val mp = MediaPlayer()
                      player = mp
                      mp.setDataSource(file.path)
                      mp.setOnCompletionListener { finish() }
                      mp.setOnErrorListener { _, _, _ -> finish(); true }
                      mp.prepare()
                      mp.start()
                  } catch (e: Exception) {
                      finish()
                  }
              }
          }
