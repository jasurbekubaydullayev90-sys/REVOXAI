          package com.example.jarvis

          import android.accessibilityservice.AccessibilityService
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo

          class JarvisAccessibilityService : AccessibilityService() {

              companion object {
                  @Volatile var isRunning = false
                  @Volatile var pendingContact: String? = null
                  @Volatile var stage = 0 // 0 = kontaktni tanlash, 1 = "Yuborish"ni bosish
              }

              override fun onServiceConnected() { isRunning = true }
              override fun onUnbind(intent: android.content.Intent?): Boolean { isRunning = false; return super.onUnbind(intent) }
              override fun onInterrupt() {}

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  val contact = pendingContact ?: return
                  if (event?.packageName != "org.telegram.messenger") return
                  val root = rootInActiveWindow ?: return

                  when (stage) {
                      0 -> {
                          val node = root.findAccessibilityNodeInfosByText(contact).firstOrNull()
                          if (node != null && clickNode(node)) stage = 1
                      }
                      1 -> {
                          for (label in listOf("Send", "Yuborish", "Отправить")) {
                              val btn = root.findAccessibilityNodeInfosByText(label).firstOrNull()
                              if (btn != null && clickNode(btn)) {
                                  pendingContact = null
                                  stage = 0
                                  return
                              }
                          }
                      }
                  }
              }

              private fun clickNode(node: AccessibilityNodeInfo): Boolean {
                  var n: AccessibilityNodeInfo? = node
                  while (n != null) {
                      if (n.isClickable) return n.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                      n = n.parent
                  }
                  return false
              }
          }
