          package com.example.jarvis

          import android.Manifest
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.AlarmClock
          import android.provider.MediaStore
          import android.provider.Settings
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.text.InputType
          import android.view.Gravity
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat
          import androidx.lifecycle.Lifecycle
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.URLEncoder

          class MainActivity : AppCompatActivity() {

              private lateinit var hud: HudView
              private lateinit var status: TextView
              private lateinit var line: TextView
              private lateinit var speaker: Speaker
              private lateinit var prefs: SharedPreferences
              private val ui = Handler(Looper.getMainLooper())

              private var recognizer: SpeechRecognizer? = null
              private var convo = false
              private var busy = false
              private var listening = false
              private var errCount = 0
              private var li = 0
              private val langs = listOf("uz-UZ", "ru-RU", "en-US")
              private val history = JSONArray()

              private val micPerm = registerForActivityResult(ActivityResultContracts.RequestPermission()) { ok ->
                  if (ok) startConvo() else setLine("Mikrofon ruxsati kerak. Telefon sozlamalaridan yoqing.")
              }

              // ---------------------------------------------------------------- UI

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  window.statusBarColor = Color.BLACK
                  prefs = getSharedPreferences("jarvis", Context.MODE_PRIVATE)
                  speaker = Speaker(this, ui)
                  loadKeys()

                  val d = resources.displayMetrics.density
                  val root = FrameLayout(this)
                  hud = HudView(this)
                  root.addView(hud, FrameLayout.LayoutParams(-1, -1))

                  val title = TextView(this).apply {
                      text = "J.A.R.V.I.S"
                      setTextColor(Color.rgb(142, 242, 255))
                      textSize = 20f
                      letterSpacing = 0.15f
                      typeface = Typeface.DEFAULT_BOLD
                  }
                  root.addView(title, FrameLayout.LayoutParams(-2, -2, Gravity.TOP or Gravity.START).apply {
                      setMargins((30 * d).toInt(), (36 * d).toInt(), 0, 0)
                  })

                  val gear = TextView(this).apply {
                      text = "\u2699"
                      setTextColor(Color.rgb(25, 211, 255))
                      textSize = 28f
                      setPadding((14 * d).toInt(), (8 * d).toInt(), (14 * d).toInt(), (8 * d).toInt())
                      setOnClickListener { showSettings() }
                  }
                  root.addView(gear, FrameLayout.LayoutParams(-2, -2, Gravity.TOP or Gravity.END).apply {
                      setMargins(0, (28 * d).toInt(), (18 * d).toInt(), 0)
                  })

                  status = TextView(this).apply {
                      setTextColor(Color.rgb(25, 211, 255))
                      textSize = 13f
                      letterSpacing = 0.3f
                      gravity = Gravity.CENTER
                  }
                  line = TextView(this).apply {
                      setTextColor(Color.rgb(200, 245, 255))
                      textSize = 19f
                      gravity = Gravity.CENTER
                      maxLines = 5
                  }
                  val bottom = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding((26 * d).toInt(), 0, (26 * d).toInt(), 0)
                      addView(status)
                      addView(line)
                  }
                  root.addView(bottom, FrameLayout.LayoutParams(-1, -2, Gravity.BOTTOM).apply {
                      setMargins(0, 0, 0, (34 * d).toInt())
                  })

                  hud.setOnClickListener { toggle() }
                  setContentView(root)
                  setStatus("TAYYOR")
                  setLine("Yadroni bosing va gapiring.")
              }

              private fun setStatus(s: String) { status.text = s }
              private fun setLine(s: String) { line.text = s }

              private fun loadKeys() {
                  speaker.azureKey = (prefs.getString("azure_key", "") ?: "").trim()
                  speaker.azureRegion = (prefs.getString("azure_region", "") ?: "").trim().ifEmpty { "westeurope" }
              }

              private fun showSettings() {
                  val d = resources.displayMetrics.density
                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding((20 * d).toInt(), (10 * d).toInt(), (20 * d).toInt(), 0)
                  }
                  fun field(hint: String, key: String, secret: Boolean): EditText {
                      val e = EditText(this)
                      e.hint = hint
                      e.setText(prefs.getString(key, ""))
                      e.setSingleLine()
                      if (secret) e.inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                      box.addView(e)
                      return e
                  }
                  val claude = field("Claude yoki Gemini API kaliti", "claude", true)
                  val note = TextView(this)
                  note.text = "Quyidagisi ixtiyoriy: Azure Speech kaliti bo'lsa, haqiqiy erkak ovozi (Sardor) ishlaydi."
                  note.textSize = 13f
                  box.addView(note)
                  val azKey = field("Azure Speech kaliti", "azure_key", true)
                  val azRegion = field("Azure region (masalan: westeurope)", "azure_region", false)
                  val acc = Button(this)
                  acc.text = "Accessibility sozlamalari (Telegram uchun)"
                  acc.setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  box.addView(acc)

                  AlertDialog.Builder(this)
                      .setTitle("Sozlamalar")
                      .setView(box)
                      .setPositiveButton("Saqlash") { _, _ ->
                          prefs.edit()
                              .putString("claude", claude.text.toString().trim())
                              .putString("azure_key", azKey.text.toString().trim())
                              .putString("azure_region", azRegion.text.toString().trim())
                              .apply()
                          loadKeys()
                      }
                      .setNegativeButton("Yopish", null)
                      .show()
              }

              // ---------------------------------------------------------------- conversation

              private fun toggle() {
                  if (convo) { stopConvo(); return }
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      micPerm.launch(Manifest.permission.RECORD_AUDIO)
                      return
                  }
                  startConvo()
              }

              private fun startConvo() {
                  if ((prefs.getString("claude", "") ?: "").isBlank()) {
                      setLine("Avval API kalitini kiriting (Gemini yoki Claude) (tepada o'ngdagi belgi).")
                      showSettings()
                      return
                  }
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      setLine("Telefonda Google ovoz aniqlash topilmadi.")
                      return
                  }
                  convo = true
                  errCount = 0
                  busy = true
                  hud.state = HudState.SPEAKING
                  setStatus("")
                  speaker.speak("Eshitaman.") { busy = false; listen() }
              }

              private fun stopConvo() {
                  convo = false
                  busy = false
                  listening = false
                  recognizer?.cancel()
                  speaker.stop()
                  hud.state = HudState.IDLE
                  hud.level = 0f
                  setStatus("TAYYOR")
              }

              private fun listen() {
                  if (!convo || busy || listening) return
                  val r = recognizer ?: SpeechRecognizer.createSpeechRecognizer(this).also {
                      it.setRecognitionListener(listener)
                      recognizer = it
                  }
                  val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                      .putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      .putExtra(RecognizerIntent.EXTRA_LANGUAGE, langs[li])
                      .putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                  listening = true
                  hud.state = HudState.LISTENING
                  setStatus("ESHITYAPMAN")
                  r.startListening(i)
              }

              private val listener = object : RecognitionListener {
                  override fun onReadyForSpeech(params: Bundle?) {}
                  override fun onBeginningOfSpeech() {}
                  override fun onBufferReceived(buffer: ByteArray?) {}
                  override fun onEndOfSpeech() {}
                  override fun onEvent(eventType: Int, params: Bundle?) {}

                  override fun onRmsChanged(rmsdB: Float) {
                      hud.level = ((rmsdB + 2f) / 12f).coerceIn(0f, 1f)
                  }

                  override fun onPartialResults(partialResults: Bundle?) {
                      val t = partialResults?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()
                      if (!t.isNullOrBlank()) setLine(t)
                  }

                  override fun onResults(results: Bundle?) {
                      listening = false
                      val t = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()
                      if (!convo) return
                      if (t.isNullOrBlank()) { ui.postDelayed({ listen() }, 300); return }
                      handle(t)
                  }

                  override fun onError(error: Int) {
                      listening = false
                      if (!convo) return
                      when (error) {
                          5 -> {} // ERROR_CLIENT: o'zimiz bekor qilganda
                          6, 7 -> { // timeout / no match
                              if (++errCount < 6) ui.postDelayed({ listen() }, 300)
                              else { stopConvo(); setLine("Hech narsa eshitilmadi. Yadroni qayta bosing.") }
                          }
                          12, 13 -> { // til qo'llanmaydi
                              if (li < langs.size - 1) { li++; ui.postDelayed({ listen() }, 200) }
                              else { stopConvo(); setLine("Ovoz aniqlash tili topilmadi.") }
                          }
                          8 -> { recognizer?.cancel(); ui.postDelayed({ listen() }, 500) }
                          9 -> { stopConvo(); micPerm.launch(Manifest.permission.RECORD_AUDIO) }
                          2, 4 -> { stopConvo(); setLine("Internet kerak (ovoz aniqlash uchun).") }
                          else -> { stopConvo(); setLine("Ovoz xatosi: " + error) }
                      }
                  }
              }

              private fun handle(text: String) {
                  errCount = 0
                  busy = true
                  hud.state = HudState.THINKING
                  setStatus("O'YLAMOQDA")
                  setLine(text)
                  val key = prefs.getString("claude", "") ?: ""
                  Thread {
                      var cmd: JSONObject? = null
                      var err = ""
                      try {
                          cmd = Brain.ask(key, history, text)
                      } catch (e: Exception) {
                          err = e.message ?: e.toString()
                      }
                      val result = cmd
                      ui.post { if (convo) act(result, err) }
                  }.start()
              }

              private fun act(cmd: JSONObject?, err: String) {
                  if (cmd == null) {
                      setLine("Xato: " + err)
                      hud.state = HudState.SPEAKING
                      speaker.speak("Ulanib bo'lmadi. Internet yoki kalitni tekshiring.") { stopConvo() }
                      return
                  }
                  val reply = cmd.optString("reply")
                  setLine(reply)
                  setStatus("")
                  hud.state = HudState.SPEAKING

                  var action: (() -> Boolean)? = null
                  when (cmd.optString("type")) {
                      "youtube" -> {
                          val q = cmd.optString("query").trim()
                          val u = if (q.isEmpty()) "https://www.youtube.com"
                          else "https://www.youtube.com/results?search_query=" + URLEncoder.encode(q, "UTF-8")
                          action = { view(u, "com.google.android.youtube") }
                      }
                      "telegram" -> {
                          val c = cmd.optString("contact")
                          val m = cmd.optString("message")
                          action = { sendTelegram(c, m) }
                      }
                      "app" -> {
                          val name = cmd.optString("app")
                          action = { openApp(name) }
                      }
                      "open" -> {
                          val u = cmd.optString("url")
                          if (u.startsWith("https://")) action = { view(u, null) }
                      }
                      "call" -> {
                          val n = cmd.optString("number").filter { it.isDigit() || it == '+' }
                          if (n.isNotEmpty()) action = { startSafe(Intent(Intent.ACTION_DIAL, Uri.parse("tel:" + n))) }
                      }
                      "alarm" -> {
                          val h = cmd.optInt("hour")
                          val mi = cmd.optInt("minute")
                          action = {
                              startSafe(
                                  Intent(AlarmClock.ACTION_SET_ALARM)
                                      .putExtra(AlarmClock.EXTRA_HOUR, h)
                                      .putExtra(AlarmClock.EXTRA_MINUTES, mi)
                                      .putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                              )
                          }
                      }
                      "timer" -> {
                          val s = cmd.optInt("seconds")
                          action = {
                              startSafe(
                                  Intent(AlarmClock.ACTION_SET_TIMER)
                                      .putExtra(AlarmClock.EXTRA_LENGTH, s)
                                      .putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                              )
                          }
                      }
                  }

                  val a = action
                  speaker.speak(reply) {
                      if (a == null) {
                          busy = false
                          listen()
                      } else {
                          val ok = a()
                          if (!ok) {
                              speaker.speak("Buni bajara olmadim.") { busy = false; listen() }
                          } else {
                              busy = false
                              // boshqa ilova ochilsa, qaytganda onResume davom ettiradi
                              ui.postDelayed({
                                  if (convo && !busy && !listening &&
                                      lifecycle.currentState.isAtLeast(Lifecycle.State.RESUMED)
                                  ) listen()
                              }, 1500)
                          }
                      }
                  }
              }

              // ---------------------------------------------------------------- actions

              private fun startSafe(i: Intent): Boolean =
                  try { startActivity(i); true } catch (e: Exception) { false }

              private fun view(uri: String, pkg: String?): Boolean {
                  val i = Intent(Intent.ACTION_VIEW, Uri.parse(uri))
                  if (pkg != null) {
                      try { startActivity(Intent(i).setPackage(pkg)); return true } catch (_: Exception) {}
                  }
                  return startSafe(i)
              }

              private fun sendTelegram(contact: String, message: String): Boolean {
                  if (!JarvisAccessibilityService.isRunning) {
                      setLine("Telegramda xabarni o'zi yuborishi uchun Accessibility yoqilishi kerak.")
                  }
                  JarvisAccessibilityService.pendingContact = contact
                  JarvisAccessibilityService.stage = 0
                  return startSafe(
                      Intent(Intent.ACTION_SEND).setType("text/plain")
                          .putExtra(Intent.EXTRA_TEXT, message)
                          .setPackage("org.telegram.messenger")
                  )
              }

              private fun openApp(name: String): Boolean {
                  val n = name.trim().lowercase()
                  if (n.isEmpty()) return false
                  if (n == "kamera" || n == "camera") return startSafe(Intent(MediaStore.INTENT_ACTION_STILL_IMAGE_CAMERA))
                  if (n == "sozlamalar" || n == "settings") return startSafe(Intent(Settings.ACTION_SETTINGS))
                  val pm = packageManager
                  val launcher = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  val hit = pm.queryIntentActivities(launcher, 0)
                      .firstOrNull { it.loadLabel(pm).toString().contains(name.trim(), true) }
                      ?: return false
                  val i = pm.getLaunchIntentForPackage(hit.activityInfo.packageName) ?: return false
                  return startSafe(i)
              }

              // ---------------------------------------------------------------- lifecycle

              override fun onResume() {
                  super.onResume()
                  if (convo && !busy && !listening) listen()
              }

              override fun onPause() {
                  super.onPause()
                  if (convo) {
                      recognizer?.cancel()
                      listening = false
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  recognizer?.destroy()
                  speaker.shutdown()
              }
          }
